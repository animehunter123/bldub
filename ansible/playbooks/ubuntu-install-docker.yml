---
- name: Install Docker Engine on Ubuntu
  hosts: all
  become: yes

  vars:
    docker_packages_remove:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc

  tasks:

    - name: Remove conflicting old packages
      ansible.builtin.apt:
        name: "{{ docker_packages_remove }}"
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Ensure APT tools installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: yes

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository (modern .sources format)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['lsb']['codename'] }}
          Components: stable
          # Architectures: {{ ansible_facts['architecture'] }} this says x64, its "amd64"!!!!!!!!!!!!!!!!!!!!
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable & start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: yes
        state: started